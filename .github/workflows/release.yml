name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing RC tag to publish; leave empty for authentication preflight"
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check release candidate version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const expected = process.env.RELEASE_TAG
              ? process.env.RELEASE_TAG.replace(/^v/, "")
              : JSON.parse(readFileSync("packages/client/package.json", "utf8")).version;
            if (!/^\d+\.\d+\.\d+-rc\.\d+$/.test(expected))
              throw new Error("This workflow publishes release candidates to next only");
            for (const name of ["client", "host", "build", "create-druid-ui"]) {
              const pkg = JSON.parse(readFileSync(`packages/${name}/package.json`, "utf8"));
              if (pkg.version !== expected) throw new Error(`${pkg.name}: expected ${expected}, got ${pkg.version}`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${expected}\n`);
          '

      - name: Check client bootstrap requirement
        id: client
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { appendFileSync } from "node:fs";
            let bootstrap = false;
            try {
              execFileSync("npm", ["view", `@druid-ui/client@${process.env.RELEASE_VERSION}`, "version", "--json"], { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
            } catch (error) {
              if (JSON.parse(String(error.stdout)).error?.code !== "E404") throw error;
              bootstrap = true;
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `required=${bootstrap}\n`);
          '

      - name: Validate bootstrap authentication before publishing
        if: steps.client.outputs.required == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "Client bootstrap requires an npm token authorized to create @druid-ui/client"; exit 1; }
          npm whoami --registry=https://registry.npmjs.org

      - name: Build all packages
        if: github.event_name == 'push' || inputs.release_tag != ''
        run: npm run build

      - name: Bootstrap client package on next
        if: (github.event_name == 'push' || inputs.release_tag != '') && steps.client.outputs.required == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace=@druid-ui/client --access public --tag next

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx changeset publish --tag next --no-git-tag
