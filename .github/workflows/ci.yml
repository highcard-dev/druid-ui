name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  native-rust-build:
    runs-on: ubuntu-latest
    container: rust:1.99-slim-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install --locked wasm-tools --version 1.262.0
      - name: Verify Rust-only build and watch without Node/npm
        run: |
          ! command -v node
          ! command -v npm
          sh scripts/test-rust-build.sh
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24, 26]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust for the Rust guest example
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build all packages
        run: npm run build

      - name: Test SDK
        run: npm test

      - name: Build examples
        run: npm run build:examples

      - name: Verify Rust guest interoperability
        if: matrix.node-version == 24
        run: npm run test:rust

      - name: Verify packed packages and generated projects
        if: matrix.node-version == 24
        run: npm run verify:packages
